    <circle cx="65" cy="65" r="10" fill="url(#blueGrad)" filter="url(#glow)" />
    <circle cx="65" cy="35" r="5" fill="#06b6d4" />
    <circle cx="95" cy="65" r="5" fill="#06b6d4" />
    <circle cx="65" cy="95" r="5" fill="#06b6d4" />
    <circle cx="35" cy="65" r="5" fill="#06b6d4" />
    <line x1="65" y1="35" x2="65" y2="55" stroke="#3b82f6" stroke-width="2" />
    <line x1="95" y1="65" x2="75" y2="65" stroke="#3b82f6" stroke-width="2" />
    <line x1="65" y1="95" x2="65" y2="75" stroke="#3b82f6" stroke-width="2" />
    <line x1="35" y1="65" x2="55" y2="65" stroke="#3b82f6" stroke-width="2" />
