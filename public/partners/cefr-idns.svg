<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <radialGradient id="globeGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c2e9fb" />
      <stop offset="40%" stop-color="#00d2ff" />
      <stop offset="90%" stop-color="#1a2a6c" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#b3dbff" />
      <stop offset="70%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#1d2b64" />
    </linearGradient>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a1c4fd" />
    </linearGradient>
    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Star frame 1 (rotated 45deg) -->
  <rect x="40" y="20" width="120" height="120" rx="15" ry="15"
    fill="rgba(26,42,108,0.3)" stroke="#4facfe" stroke-width="4"
    transform="rotate(45, 100, 80)" filter="url(#glowBlue)" />

  <!-- Star frame 2 (no rotation) -->
  <rect x="40" y="20" width="120" height="120" rx="15" ry="15"
    fill="none" stroke="#8a2be2" stroke-width="4"
    filter="url(#glowBlue)" />

  <!-- Crystal globe -->
  <circle cx="100" cy="80" r="45" fill="url(#globeGrad)" stroke="#ffffff" stroke-width="2"
    filter="url(#glowBlue)" />

  <!-- Feather (pen) symbol -->
  <polygon points="100,50 110,65 105,80 100,95 95,80 90,65"
    fill="url(#featherGrad)" transform="rotate(-25, 100, 80)"
    filter="url(#glowBlue)" />

  <!-- Brand text -->
  <text x="180" y="95" font-family="'Arial Black', Gadget, sans-serif" font-size="48" font-weight="900"
    fill="url(#textGrad)" letter-spacing="4" filter="url(#glowBlue)">CEFR IDNS</text>

  <!-- Reflection -->
  <text x="180" y="130" font-family="'Arial Black', Gadget, sans-serif" font-size="48" font-weight="900"
    fill="url(#textGrad)" letter-spacing="4" opacity="0.25"
    transform="scale(1, -0.5) translate(0, -290)">CEFR IDNS</text>
</svg>
